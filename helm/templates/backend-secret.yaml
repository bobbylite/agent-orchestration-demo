{{- if and .Values.backend.secrets.create (not .Values.backend.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentorchestration.fullname" . }}-backend
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
type: Opaque
stringData:
  OIDC_CLIENT_SECRET: {{ .Values.backend.secrets.OIDC_CLIENT_SECRET | quote }}
  AGENT_CLIENT_SECRET: {{ .Values.backend.secrets.AGENT_CLIENT_SECRET | quote }}
  AGENT_DELEGATION_CLIENT_SECRET: {{ .Values.backend.secrets.AGENT_DELEGATION_CLIENT_SECRET | quote }}
  CIBA_CLIENT_ID: {{ .Values.backend.secrets.CIBA_CLIENT_ID | quote }}
  CIBA_CLIENT_SECRET: {{ .Values.backend.secrets.CIBA_CLIENT_SECRET | quote }}
  SESSION_SECRET: {{ .Values.backend.secrets.SESSION_SECRET | quote }}
  ANTHROPIC_API_KEY: {{ .Values.backend.secrets.ANTHROPIC_API_KEY | quote }}
  OPENAI_API_KEY: {{ .Values.backend.secrets.OPENAI_API_KEY | quote }}
  GROQ_API_KEY: {{ .Values.backend.secrets.GROQ_API_KEY | quote }}
  LANGSMITH_API_KEY: {{ .Values.backend.secrets.LANGSMITH_API_KEY | quote }}
{{- end }}
