apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentorchestration.fullname" . }}-mcp-todos-config
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
data:
  OIDC_DISCOVERY_URL: {{ .Values.mcpTodosServer.env.OIDC_DISCOVERY_URL | quote }}
  OIDC_CLIENT_ID: {{ .Values.mcpTodosServer.env.OIDC_CLIENT_ID | quote }}
  OIDC_SCOPES: {{ .Values.mcpTodosServer.env.OIDC_SCOPES | quote }}
  OIDC_POST_LOGOUT_REDIRECT_URI: {{ .Values.mcpTodosServer.env.OIDC_POST_LOGOUT_REDIRECT_URI | quote }}
  AGENT_EXPECTED_AUDIENCE: {{ .Values.mcpTodosServer.env.AGENT_EXPECTED_AUDIENCE | quote }}
  ALLOWED_AGENT_CLIENT_ID: {{ .Values.mcpTodosServer.env.ALLOWED_AGENT_CLIENT_ID | quote }}
  TODOS_READ_SCOPE: {{ .Values.mcpTodosServer.env.TODOS_READ_SCOPE | quote }}
  TODOS_WRITE_SCOPE: {{ .Values.mcpTodosServer.env.TODOS_WRITE_SCOPE | quote }}
  AGENT_DISPLAY_NAME: {{ .Values.mcpTodosServer.env.AGENT_DISPLAY_NAME | quote }}
  APP_BASE_URL: {{ .Values.mcpTodosServer.env.APP_BASE_URL | quote }}
  FRONTEND_ORIGIN: {{ .Values.mcpTodosServer.env.FRONTEND_ORIGIN | quote }}
