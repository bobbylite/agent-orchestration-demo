# nginx.conf rendered with the cluster-internal backend Service name so the
# /api/ proxy works correctly inside Kubernetes without nginx knowing the
# release name at image build time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentorchestration.fullname" . }}-frontend-nginx
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://{{ include "agentorchestration.backendSvcName" . }}:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location /task-agent-api/ {
            proxy_pass http://{{ include "agentorchestration.taskAgentSvcName" . }}:{{ .Values.taskAgent.service.port }}/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }


        location /mcp-todos-api/ {
            proxy_pass http://{{ include "agentorchestration.mcpTodosSvcName" . }}:{{ .Values.mcpTodosServer.service.port }}/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location / {
            try_files $uri /index.html;
        }
    }
