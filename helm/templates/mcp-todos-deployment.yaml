apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentorchestration.fullname" . }}-mcp-todos-server
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-todos-server
spec:
  replicas: {{ .Values.mcpTodosServer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentorchestration.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mcp-todos-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentorchestration.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcp-todos-server
    spec:
      containers:
        - name: mcp-todos-server
          image: {{ include "agentorchestration.image" (dict "root" . "name" .Values.mcpTodosServer.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcpTodosServer.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.mcpTodosServer.resources | nindent 12 }}
