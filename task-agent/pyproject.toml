[project]
name = "task-agent"
version = "0.1.0"
description = "Specialist Agent — A2A server, reasons about which mocked MCP tool to invoke"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "a2a-sdk>=1.1.0",
    "langgraph>=0.2.45",
    "langchain-anthropic>=0.3.0",
    "langchain-mcp-adapters>=0.3.0",
    "agentorchestration-shared",
    "langchain-groq>=1.1.3",
]

[tool.uv.sources]
agentorchestration-shared = { path = "../shared", editable = true }

[tool.uv]
package = false
