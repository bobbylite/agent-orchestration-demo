apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentorchestration.fullname" . }}-todos-ui
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: todos-ui
spec:
  replicas: {{ .Values.todosUi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentorchestration.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: todos-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentorchestration.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: todos-ui
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: todos-ui
          image: {{ include "agentorchestration.image" (dict "root" . "name" .Values.todosUi.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.todosUi.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "agentorchestration.fullname" . }}-todos-ui-nginx
