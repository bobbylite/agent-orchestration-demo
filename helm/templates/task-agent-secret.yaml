{{- if and .Values.taskAgent.secrets.create (not .Values.taskAgent.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentorchestration.fullname" . }}-task-agent
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
type: Opaque
stringData:
  TASK_AGENT_CLIENT_ID: {{ .Values.taskAgent.secrets.TASK_AGENT_CLIENT_ID | quote }}
  TASK_AGENT_CLIENT_SECRET: {{ .Values.taskAgent.secrets.TASK_AGENT_CLIENT_SECRET | quote }}
  TODOS_MCP_CLIENT_ID: {{ .Values.taskAgent.secrets.TODOS_MCP_CLIENT_ID | quote }}
  TODOS_MCP_CLIENT_SECRET: {{ .Values.taskAgent.secrets.TODOS_MCP_CLIENT_SECRET | quote }}
  AUTHORIZE_CLIENT_ID: {{ .Values.taskAgent.secrets.AUTHORIZE_CLIENT_ID | quote }}
  AUTHORIZE_CLIENT_SECRET: {{ .Values.taskAgent.secrets.AUTHORIZE_CLIENT_SECRET | quote }}
  ANTHROPIC_API_KEY: {{ .Values.taskAgent.secrets.ANTHROPIC_API_KEY | quote }}
  OPENAI_API_KEY: {{ .Values.taskAgent.secrets.OPENAI_API_KEY | quote }}
  GROQ_API_KEY: {{ .Values.taskAgent.secrets.GROQ_API_KEY | quote }}
  LANGSMITH_API_KEY: {{ .Values.taskAgent.secrets.LANGSMITH_API_KEY | quote }}
{{- end }}
