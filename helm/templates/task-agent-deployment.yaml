apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentorchestration.fullname" . }}-task-agent
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: task-agent
spec:
  replicas: {{ .Values.taskAgent.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentorchestration.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: task-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentorchestration.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: task-agent
    spec:
      containers:
        - name: task-agent
          image: {{ include "agentorchestration.image" (dict "root" . "name" .Values.taskAgent.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.taskAgent.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "agentorchestration.fullname" . }}-task-agent
          resources:
            {{- toYaml .Values.taskAgent.resources | nindent 12 }}
