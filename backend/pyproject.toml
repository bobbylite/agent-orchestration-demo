[project]
name = "agentcore-console-backend"
version = "0.1.0"
description = "PingOne-authenticated LangGraph chat console backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "joserfc>=1.0",
    "pydantic-settings>=2.5",
    "itsdangerous>=2.2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "langgraph>=0.2.45",
    "langchain-anthropic>=0.3.0",
    "sse-starlette>=2.1",
]

[tool.uv]
package = false
