apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentorchestration.todosUiSvcName" . }}
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: todos-ui
spec:
  type: {{ .Values.todosUi.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "agentorchestration.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: todos-ui
  ports:
    - name: http
      port: {{ .Values.todosUi.service.port }}
      targetPort: http
      protocol: TCP
