apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentorchestration.fullname" . }}-task-agent
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: task-agent
type: Opaque
stringData:
  OIDC_DISCOVERY_URL: {{ .Values.taskAgent.env.OIDC_DISCOVERY_URL | quote }}
  AGENT_EXPECTED_AUDIENCE: {{ .Values.taskAgent.env.AGENT_EXPECTED_AUDIENCE | quote }}
  ALLOWED_AGENT_CLIENT_ID: {{ .Values.taskAgent.env.ALLOWED_AGENT_CLIENT_ID | quote }}
  TODOS_READ_SCOPE: {{ .Values.taskAgent.env.TODOS_READ_SCOPE | quote }}
  TODOS_WRITE_SCOPE: {{ .Values.taskAgent.env.TODOS_WRITE_SCOPE | quote }}
  AGENT_MODEL: {{ .Values.taskAgent.env.AGENT_MODEL | quote }}
  HOST: {{ .Values.taskAgent.env.HOST | quote }}
  PORT: {{ .Values.taskAgent.env.PORT | quote }}
  PUBLIC_URL: {{ include "agentorchestration.taskAgentPublicUrl" . | quote }}
  MCP_TODOS_URL: {{ include "agentorchestration.mcpTodosUrl" . | quote }}
  # Sensitive
  ANTHROPIC_API_KEY: {{ .Values.taskAgent.secrets.ANTHROPIC_API_KEY | quote }}
