[project]
name = "agentcore-shared"
version = "0.1.0"
description = "Shared inbound-auth verification used by every agent service in this repo"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "joserfc>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
