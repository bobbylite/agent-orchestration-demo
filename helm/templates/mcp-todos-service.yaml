apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentorchestration.mcpTodosSvcName" . }}
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-todos-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "agentorchestration.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-todos-server
  ports:
    - name: http
      port: {{ .Values.mcpTodosServer.service.port }}
      targetPort: http
      protocol: TCP
