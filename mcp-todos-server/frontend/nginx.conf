server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxied on the same origin as the static frontend so PingOne's
    # session cookie (host-scoped, set by mcp-todos-server during
    # /callback) round-trips without any cross-site cookie configuration.
    location /api/ {
        proxy_pass http://mcp-todos-server:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
