{{- if and .Values.mcpTodosServer.secrets.create (not .Values.mcpTodosServer.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentorchestration.fullname" . }}-mcp-todos
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
type: Opaque
stringData:
  OIDC_CLIENT_SECRET: {{ .Values.mcpTodosServer.secrets.OIDC_CLIENT_SECRET | quote }}
  SESSION_SECRET: {{ .Values.mcpTodosServer.secrets.SESSION_SECRET | quote }}
  AUTHORIZE_CLIENT_ID: {{ .Values.mcpTodosServer.secrets.AUTHORIZE_CLIENT_ID | quote }}
  AUTHORIZE_CLIENT_SECRET: {{ .Values.mcpTodosServer.secrets.AUTHORIZE_CLIENT_SECRET | quote }}
{{- end }}
