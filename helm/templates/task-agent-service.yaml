apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentorchestration.taskAgentSvcName" . }}
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: task-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "agentorchestration.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: task-agent
  ports:
    - name: http
      port: {{ .Values.taskAgent.service.port }}
      targetPort: http
      protocol: TCP
