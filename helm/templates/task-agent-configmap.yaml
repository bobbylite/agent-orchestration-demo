apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentorchestration.fullname" . }}-task-agent-config
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
data:
  OIDC_DISCOVERY_URL: {{ .Values.taskAgent.env.OIDC_DISCOVERY_URL | quote }}
  AGENT_EXPECTED_AUDIENCE: {{ .Values.taskAgent.env.AGENT_EXPECTED_AUDIENCE | quote }}
  EXPECTED_DELEGATION_SCOPE: {{ .Values.taskAgent.env.EXPECTED_DELEGATION_SCOPE | quote }}
  ALLOWED_AGENT_CLIENT_ID: {{ .Values.taskAgent.env.ALLOWED_AGENT_CLIENT_ID | quote }}
  AGENT_TASK_SCOPE: {{ .Values.taskAgent.env.AGENT_TASK_SCOPE | quote }}
  MCP_TODOS_AUDIENCE: {{ include "agentorchestration.mcpTodosAudience" . | quote }}
  TODOS_READ_SCOPE: {{ .Values.taskAgent.env.TODOS_READ_SCOPE | quote }}
  TODOS_WRITE_SCOPE: {{ .Values.taskAgent.env.TODOS_WRITE_SCOPE | quote }}
  AUTHORIZE_DECISION_ENDPOINT: {{ .Values.taskAgent.env.AUTHORIZE_DECISION_ENDPOINT | quote }}
  AUTHORIZE_SCOPE: {{ .Values.taskAgent.env.AUTHORIZE_SCOPE | quote }}
  AUTHORIZE_CLIENT_AUTH_METHOD: {{ .Values.taskAgent.env.AUTHORIZE_CLIENT_AUTH_METHOD | quote }}
  AUTHORIZE_DELEGATE_TASKS_POLICY_PARAMETER: {{ .Values.taskAgent.env.AUTHORIZE_DELEGATE_TASKS_POLICY_PARAMETER | quote }}
  AUTHORIZE_DELEGATE_TASKS_POLICY_VALUE: {{ .Values.taskAgent.env.AUTHORIZE_DELEGATE_TASKS_POLICY_VALUE | quote }}
  AUTHORIZE_TASK_POLICY_PARAMETER: {{ .Values.taskAgent.env.AUTHORIZE_TASK_POLICY_PARAMETER | quote }}
  AUTHORIZE_TASK_POLICY_VALUE: {{ .Values.taskAgent.env.AUTHORIZE_TASK_POLICY_VALUE | quote }}
  EVALUATOR_OPTIMIZER_POLICY_PARAMETER: {{ .Values.taskAgent.env.EVALUATOR_OPTIMIZER_POLICY_PARAMETER | quote }}
  AGENT_MODEL: {{ .Values.taskAgent.env.AGENT_MODEL | quote }}
  MODEL_PROVIDER: {{ .Values.taskAgent.env.MODEL_PROVIDER | quote }}
  MODEL_ID: {{ .Values.taskAgent.env.MODEL_ID | quote }}
  GROQ_MODEL: {{ .Values.taskAgent.env.GROQ_MODEL | quote }}
  JUDGE_ENABLED: {{ .Values.taskAgent.env.JUDGE_ENABLED | quote }}
  JUDGE_PROVIDER: {{ .Values.taskAgent.env.JUDGE_PROVIDER | quote }}
  JUDGE_MODEL: {{ .Values.taskAgent.env.JUDGE_MODEL | quote }}
  JUDGE_MAX_ATTEMPTS: {{ .Values.taskAgent.env.JUDGE_MAX_ATTEMPTS | quote }}
  LANGSMITH_TRACING: {{ .Values.taskAgent.env.LANGSMITH_TRACING | quote }}
  LANGSMITH_ENDPOINT: {{ .Values.taskAgent.env.LANGSMITH_ENDPOINT | quote }}
  LANGSMITH_PROJECT: {{ .Values.taskAgent.env.LANGSMITH_PROJECT | quote }}
  MCP_TODOS_URL: {{ include "agentorchestration.mcpTodosUrl" . | quote }}
  HOST: {{ .Values.taskAgent.env.HOST | quote }}
  PORT: {{ .Values.taskAgent.env.PORT | quote }}
  PUBLIC_URL: {{ include "agentorchestration.taskAgentPublicUrl" . | quote }}
