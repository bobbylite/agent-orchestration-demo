apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentorchestration.fullname" . }}-backend
  labels:
    {{- include "agentorchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Non-sensitive config
  APP_BASE_URL: {{ .Values.backend.env.APP_BASE_URL | quote }}
  FRONTEND_ORIGIN: {{ .Values.backend.env.FRONTEND_ORIGIN | quote }}
  OIDC_DISCOVERY_URL: {{ .Values.backend.env.OIDC_DISCOVERY_URL | quote }}
  OIDC_CLIENT_ID: {{ .Values.backend.env.OIDC_CLIENT_ID | quote }}
  OIDC_SCOPES: {{ .Values.backend.env.OIDC_SCOPES | quote }}
  OIDC_POST_LOGOUT_REDIRECT_URI: {{ .Values.backend.env.OIDC_POST_LOGOUT_REDIRECT_URI | quote }}
  AGENT_CLIENT_ID: {{ .Values.backend.env.AGENT_CLIENT_ID | quote }}
  AGENT_SCOPES: {{ .Values.backend.env.AGENT_SCOPES | quote }}
  AGENT_EXPECTED_AUDIENCE: {{ .Values.backend.env.AGENT_EXPECTED_AUDIENCE | quote }}
  TODOS_READ_SCOPE: {{ .Values.backend.env.TODOS_READ_SCOPE | quote }}
  TODOS_WRITE_SCOPE: {{ .Values.backend.env.TODOS_WRITE_SCOPE | quote }}
  AGENT_MODEL: {{ .Values.backend.env.AGENT_MODEL | quote }}
  TASK_AGENT_URL: {{ include "agentorchestration.taskAgentUrl" . | quote }}
  # Sensitive — supply via --set backend.secrets.* or a sealed-secrets overlay
  OIDC_CLIENT_SECRET: {{ .Values.backend.secrets.OIDC_CLIENT_SECRET | quote }}
  AGENT_CLIENT_SECRET: {{ .Values.backend.secrets.AGENT_CLIENT_SECRET | quote }}
  SESSION_SECRET: {{ .Values.backend.secrets.SESSION_SECRET | quote }}
  ANTHROPIC_API_KEY: {{ .Values.backend.secrets.ANTHROPIC_API_KEY | quote }}
