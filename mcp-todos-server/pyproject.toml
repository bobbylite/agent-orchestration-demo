[project]
name = "mcp-todos-server"
version = "0.1.0"
description = "In-memory todos MCP server (Streamable HTTP) with a PingOne-gated web UI and an OBO audit log"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "joserfc>=1.0",
    "pydantic-settings>=2.5",
    "itsdangerous>=2.2",
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "agentorchestration-shared",
]

[tool.uv.sources]
agentorchestration-shared = { path = "../shared", editable = true }

[tool.uv]
package = false
